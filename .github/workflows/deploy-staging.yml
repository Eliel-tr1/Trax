name: Deploy staging (Cloudflare Pages)

on:
  push:
    branches: [staging, main]

jobs:
  deploy:
    # Staging only — prod (main → trax-crm.pages.dev) stays manual per ops policy.
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx vite build --base=/
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 1156721cbd092576b17bbf0a6839f745
          command: pages deploy dist --project-name=trax-crm --branch=staging
