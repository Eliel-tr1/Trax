<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <!-- Never cache the HTML: it points at hashed bundles whose names change
         with every deploy. Without this a stale tab keeps loading an old
         bundle and users report "my fixes are missing" after hard refresh. -->
    <meta http-equiv="Cache-Control" content="no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/png" href="%BASE_URL%favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700;800;900&family=Heebo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <title>TRAX CRM</title>
    <script>
      // Build stamp in localStorage: tells us WHICH bundle a given browser is
      // actually running, so a "my fixes are missing" report is diagnosable
      // from the user's side (they read this in DevTools console).
      window.addEventListener('load', function () {
        var s = document.querySelector('script[src*="index-"]');
        var stamp = 'BUILD: ' + (s ? s.src.split('/').pop() : 'unknown') + ' | ' + new Date().toISOString().slice(0, 16);
        console.log('[TRAX]', stamp);
        try { localStorage.setItem('trax_build', stamp); } catch (e) {}
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
